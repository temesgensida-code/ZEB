services:
  - type: web
    name: zeb-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash startup.sh

    envVars:
      # Auto-generated by Render — do NOT set manually
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      # Allow the Render service hostname. Replace <your-service> with the actual
      # subdomain assigned by Render (e.g. zeb-backend).
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      # Render terminates TLS before the request reaches Django, so Django must
      # NOT issue its own HTTPS redirect (that would cause an infinite redirect loop).
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"

      - key: PYTHON_VERSION
        value: "3.12"

      # Set these after you know your Netlify URL:
      #   DJANGO_CORS_ALLOWED_ORIGINS=https://<your-app>.netlify.app,http://localhost:5173
      #   DJANGO_CSRF_TRUSTED_ORIGINS=https://<your-service>.onrender.com,https://<your-app>.netlify.app
      #   GOOGLE_SAFE_BROWSING_API_KEY=<your-key>
